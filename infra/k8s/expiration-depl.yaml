apiVersion: apps/v1
kind: Deployment
metadata:
  name: expiration-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: expiration
  template:
    metadata:
      labels:
        app: expiration
    spec:
      containers:
        - name: expiration
          image: asia-south2-docker.pkg.dev/asset-dev-509615/ticketing/expiration
          env:
            - name: NATS_URL
              value: "nats://nats-serv:4222"
            - name: REDIS_HOST
              value: "expiration-redis-serv"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1024Mi"
